    <text x="40" y="304" font-size="15" font-weight="600" fill="#F8FAFC">Vue</text>
    <text x="340" y="304" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="end">25.0%</text>
    <rect x="40" y="312" width="300" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="40" y="312" width="75" height="12" rx="6" fill="url(#barGreenM)"/>
    <text x="40" y="358" font-size="15" font-weight="600" fill="#F8FAFC">Python</text>
    <text x="340" y="358" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="end">25.0%</text>
    <rect x="40" y="366" width="300" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
