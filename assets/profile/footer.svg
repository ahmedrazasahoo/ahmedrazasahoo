<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#C084FC"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
