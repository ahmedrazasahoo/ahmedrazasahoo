<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="blob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- Soft color blobs: the blurred backdrop a glass card sits in front of -->
  <circle cx="140" cy="60" r="110" fill="#2563EB" opacity="0.55" filter="url(#blob)"/>
  <circle cx="880" cy="220" r="130" fill="#22C55E" opacity="0.50" filter="url(#blob)"/>
  <circle cx="520" cy="230" r="90" fill="#7C3AED" opacity="0.40" filter="url(#blob)"/>
  <circle cx="900" cy="40" r="80" fill="#06B6D4" opacity="0.35" filter="url(#blob)"/>

  <!-- Frosted glass card -->
  <rect x="60" y="48" width="880" height="164" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="url(#cardStroke)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Content -->
  <text x="100" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#F8FAFC">Ahmed Raza</text>
  <text x="100" y="155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="url(#accentText)">Frappe &amp; ERPNext Developer</text>
  <text x="100" y="185" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Custom modules &#8226; Integrations &#8226; Automation &#8226; Lahore, Pakistan</text>
</svg>
