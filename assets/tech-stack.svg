<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="blob2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <linearGradient id="chipStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="230" fill="url(#bg2)"/>

  <circle cx="120" cy="30" r="100" fill="#2563EB" opacity="0.45" filter="url(#blob2)"/>
  <circle cx="500" cy="210" r="110" fill="#7C3AED" opacity="0.38" filter="url(#blob2)"/>
  <circle cx="880" cy="40" r="110" fill="#22C55E" opacity="0.45" filter="url(#blob2)"/>
  <circle cx="950" cy="200" r="70" fill="#06B6D4" opacity="0.30" filter="url(#blob2)"/>

  <!-- Row 1: Backend and ERP -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600" font-size="16">
    <rect x="40"  y="34" width="118" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="99"  y="61" text-anchor="middle" fill="#93C5FD">Frappe</text>

    <rect x="170" y="34" width="130" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="235" y="61" text-anchor="middle" fill="#93C5FD">ERPNext</text>

    <rect x="312" y="34" width="120" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="372" y="61" text-anchor="middle" fill="#93C5FD">Python</text>

    <rect x="444" y="34" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="519" y="61" text-anchor="middle" fill="#93C5FD">REST APIs</text>

    <rect x="606" y="34" width="120" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="666" y="61" text-anchor="middle" fill="#93C5FD">MariaDB</text>

    <rect x="738" y="34" width="110" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="793" y="61" text-anchor="middle" fill="#93C5FD">Redis</text>
  </g>

  <!-- Row 2: Frontend -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600" font-size="16">
    <rect x="40"  y="93" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="115" y="120" text-anchor="middle" fill="#6EE7B7">JavaScript</text>

    <rect x="202" y="93" width="104" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="254" y="120" text-anchor="middle" fill="#6EE7B7">React</text>

    <rect x="318" y="93" width="94" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="365" y="120" text-anchor="middle" fill="#6EE7B7">Vue</text>

    <rect x="424" y="93" width="128" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="488" y="120" text-anchor="middle" fill="#6EE7B7">Tailwind</text>

    <rect x="564" y="93" width="120" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="624" y="120" text-anchor="middle" fill="#6EE7B7">HTML/CSS</text>
  </g>

  <!-- Row 3: Tools -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600" font-size="16">
    <rect x="40"  y="152" width="100" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="90"  y="179" text-anchor="middle" fill="#D8B4FE">Git</text>

    <rect x="152" y="152" width="118" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="211" y="179" text-anchor="middle" fill="#D8B4FE">Docker</text>

    <rect x="282" y="152" width="106" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="335" y="179" text-anchor="middle" fill="#D8B4FE">Bench</text>

    <rect x="400" y="152" width="112" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="456" y="179" text-anchor="middle" fill="#D8B4FE">Jinja</text>

    <rect x="524" y="152" width="130" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStroke)"/>
    <text x="589" y="179" text-anchor="middle" fill="#D8B4FE">VS Code</text>
  </g>
</svg>
