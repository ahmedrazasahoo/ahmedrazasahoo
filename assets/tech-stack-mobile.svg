    <rect x="16" y="134" width="116" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStrokeM)"/>
    <text x="74" y="159" text-anchor="middle" fill="#6EE7B7">JavaScript</text>
