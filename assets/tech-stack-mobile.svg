<svg width="380" height="380" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="blob2m" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <linearGradient id="chipStrokeM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="380" height="380" fill="url(#bg2m)"/>
  <circle cx="50" cy="20" r="90" fill="#2563EB" opacity="0.40" filter="url(#blob2m)"/>
  <circle cx="330" cy="190" r="100" fill="#7C3AED" opacity="0.35" filter="url(#blob2m)"/>
  <circle cx="60" cy="360" r="90" fill="#22C55E" opacity="0.40" filter="url(#blob2m)"/>

  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="15">
    <!-- Row 1-2: Backend/ERP (blue) -->
    <rect x="16" y="30" width="116" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStrokeM)"/>
    <text x="74" y="55" text-anchor="middle" fill="#93C5FD">Frappe</text>
    <rect x="142" y="30" width="116" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStrokeM)"/>
