    <rect x="268" y="82" width="116" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="url(#chipStrokeM)"/>
    <text x="326" y="107" text-anchor="middle" fill="#93C5FD">Redis</text>

